<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DeepMammo{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <span class="logo-dot"></span>
      DeepMammo
    </a>
    <ul class="navbar-links">
      <li><a href="/"          {% if request.resolver_match.url_name == 'home'     %}class="active"{% endif %}>Home</a></li>
      <li><a href="/dashboard" {% if request.resolver_match.url_name == 'dashboard'%}class="active"{% endif %}>Dashboard</a></li>
      <li><a href="/tutorial"  {% if request.resolver_match.url_name == 'tutorial' %}class="active"{% endif %}>Tutorial</a></li>
      <li><a href="/faq"       {% if request.resolver_match.url_name == 'faq'      %}class="active"{% endif %}>FAQ</a></li>
    </ul>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div>
      <strong>DeepMammo</strong> — AI-Assisted Mammography Analysis
    </div>
    <div style="margin-top:6px;">
      <a href="mailto:contact@deepmammo.ai">contact@deepmammo.ai</a>
      <a href="tel:+233000000000">+233 000 000 000</a>
    </div>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
