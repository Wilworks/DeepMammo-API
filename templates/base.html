<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}DeepMammo{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <style>
    /* Hard reset for HF Spaces iframe interference */
    body { margin: 0 !important; padding: 0 !important; }
    ul   { list-style: none !important; padding: 0 !important; margin: 0 !important; }
    .modal-overlay {
      position: fixed !important; inset: 0 !important;
      background: rgba(26,26,46,0.6) !important;
      z-index: 9999 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 1rem !important;
    }
    .modal-overlay.hidden { display: none !important; }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

  <nav class="navbar">
    <a href="/" class="navbar-brand">
      <span class="logo-dot"></span>
      DeepMammo
    </a>
    <ul class="navbar-links">
      <li><a href="/"         {% if request.resolver_match.url_name == 'home'      %}class="active"{% endif %}>Home</a></li>
      <li><a href="/dashboard"{% if request.resolver_match.url_name == 'dashboard' %}class="active"{% endif %}>Dashboard</a></li>
      <li><a href="/tutorial" {% if request.resolver_match.url_name == 'tutorial'  %}class="active"{% endif %}>Tutorial</a></li>
      <li><a href="/faq"      {% if request.resolver_match.url_name == 'faq'       %}class="active"{% endif %}>FAQ</a></li>
    </ul>
  </nav>

  <main>{% block content %}{% endblock %}</main>

  <footer>
    <div><strong>DeepMammo</strong> — AI-Assisted Mammography Analysis</div>
    <div style="margin-top:6px;">
      <a href="mailto:wilfredayine@gmail.com">wilfredayine@gmail.com</a>
      &nbsp;·&nbsp;
      <span>Developed by <strong>Wilfred Ayine</strong></span>
    </div>
  </footer>

  {% block extra_js %}{% endblock %}
</body>
</html>
